<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시나리오 7 — 편의점 폐기</title>
    <link rel="stylesheet" href="./scenario-7.css" />
    <script src="./scenario-7.js" defer></script>
  </head>
  <body>
    <main class="scenario7-page" aria-label="시나리오 7: 편의점 폐기">
      <div class="scenario7-stage">
        <section class="scenario7-frame" aria-label="편의점 폐기 물품 사건 시나리오">
          <div class="scenario7-story" aria-live="polite">
            <img
              class="scenario7-main-art"
              src="./scenario/scenario-7/S7_Main-1.svg"
              alt="편의점 점주와 아르바이트생의 대화"
              draggable="false"
            />
          </div>

          <div class="scenario7-intro" aria-hidden="true">
            <img class="scenario7-intro-start" src="./scenario/scenario-7/S7_Intro-1.svg" alt="" draggable="false" />
            <span class="scenario7-count"><span data-scenario7-count>0</span><span class="scenario7-degree">°</span></span>
            <img class="scenario7-intro-final" src="./scenario/scenario-7/S7_Intro-2.svg" alt="" draggable="false" />
          </div>

          <button class="scenario7-back" type="button" aria-label="시나리오에서 돌아가기">
            <img src="./components/Scenario_Back-Default.svg" alt="돌아가기" draggable="false" />
          </button>
        </section>
      </div>
    </main>
  </body>
</html>
