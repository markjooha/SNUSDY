<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시나리오 4</title>
    <link rel="stylesheet" href="./scenario-4.css" />
    <script src="./scenario-4.js" defer></script>
  </head>
  <body>
    <main class="scenario4-page" aria-label="시나리오 4">
      <div class="scenario4-stage">
        <section class="scenario4-frame" aria-label="신금역 3번 출구 포장마차 시나리오">
          <div class="scenario4-intro" aria-hidden="true">
            <span class="scenario4-count"><span data-scenario4-count>0</span><span class="scenario4-degree">°</span></span>
          </div>

          <div class="scenario4-main" aria-hidden="true">
            <div class="scenario4-scroll" tabindex="0" aria-label="신금역 3번 출구 포장마차 시나리오 내용">
              <article class="scenario4-scroll-content">
                <div class="scenario4-reveal scenario4-art-slice scenario4-art-title" aria-hidden="true"><img src="./scenario/scenario-4/S4_Main-Title.svg" alt="" /></div>
                <div class="scenario4-reveal scenario4-art-slice scenario4-art-cue" aria-hidden="true"><img src="./scenario/scenario-4/S4_Main-Cue.svg" alt="" /></div>
                <div class="scenario4-reveal scenario4-art-slice scenario4-art-quote" aria-hidden="true"><img src="./scenario/scenario-4/S4_Main-Quote.svg" alt="" /></div>
                <div class="scenario4-story-lines" data-scenario4-story="one" aria-hidden="true"></div>
                <div class="scenario4-reveal scenario4-art-slice scenario4-art-photo" aria-hidden="true"><img src="./scenario/scenario-4/S4_Main-Photos.svg" alt="" /></div>
                <div class="scenario4-reveal scenario4-art-slice scenario4-art-timeline" aria-hidden="true"><img src="./scenario/scenario-4/S4_Main-Timeline.svg" alt="" /></div>
                <div class="scenario4-story-lines" data-scenario4-story="two" aria-hidden="true"></div>
                <button class="scenario4-back" type="button" aria-label="시나리오에서 돌아가기">
                  <img class="scenario4-back-default" src="./components/Scenario_Back-Default.svg" alt="" aria-hidden="true" />
                  <img class="scenario4-back-hover" src="./components/Scenario_Back-Hover.svg" alt="" aria-hidden="true" />
                </button>
              </article>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
