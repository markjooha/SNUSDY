<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시나리오 3 — 접수 민원</title>
    <link rel="stylesheet" href="./scenario-3.css" />
    <script src="./scenario-3.js" defer></script>
  </head>
  <body>
    <main class="scenario3-page" aria-label="시나리오 3: 접수 민원">
      <div class="scenario3-stage">
        <section class="scenario3-frame" aria-label="접수 민원 시나리오">
          <div class="scenario3-intro" aria-hidden="true">
            <span class="scenario3-count"><span data-scenario3-count>0</span><span class="scenario3-degree">°</span></span>
          </div>

          <div class="scenario3-main" aria-live="polite">
            <article class="scenario3-screen is-current" data-scenario3-screen="1" aria-label="첫 번째 접수 민원">
              <img class="scenario3-art" src="./scenario/scenario-3/S3_Main-01.svg" alt="가로수 가지치기를 요청한 첫 번째 접수 민원" draggable="false" />
              <button class="scenario3-next" type="button" aria-label="다음 접수 민원 보기"><span>다음 접수 민원</span></button>
            </article>
            <article class="scenario3-screen" data-scenario3-screen="2" aria-label="두 번째 접수 민원" aria-hidden="true">
              <img class="scenario3-art" src="./scenario/scenario-3/S3_Main-02.svg" alt="집 앞 벤치 철거를 요청한 두 번째 접수 민원" draggable="false" />
              <button class="scenario3-next" type="button" aria-label="다음 접수 민원 보기"><span>다음 접수 민원</span></button>
            </article>
            <article class="scenario3-screen" data-scenario3-screen="3" aria-label="세 번째 접수 민원" aria-hidden="true">
              <img class="scenario3-art" src="./scenario/scenario-3/S3_Main-03.svg" alt="놀이터 소음을 신고한 세 번째 접수 민원" draggable="false" />
              <button class="scenario3-next" type="button" aria-label="다음 접수 민원 보기"><span>다음 접수 민원</span></button>
            </article>
            <article class="scenario3-screen" data-scenario3-screen="4" aria-label="네 번째 접수 민원" aria-hidden="true">
              <img class="scenario3-art" src="./scenario/scenario-3/S3_Main-04.svg" alt="길고양이 소음을 신고한 네 번째 접수 민원" draggable="false" />
              <button class="scenario3-next" type="button" aria-label="다음 접수 민원 보기"><span>다음 접수 민원</span></button>
            </article>
            <article class="scenario3-screen" data-scenario3-screen="5" aria-label="다섯 번째 접수 민원" aria-hidden="true">
              <img class="scenario3-art" src="./scenario/scenario-3/S3_Main-05.svg" alt="신호등 대기 시간을 신고한 다섯 번째 접수 민원" draggable="false" />
              <button class="scenario3-back" type="button" aria-label="시나리오에서 돌아가기">
                <img class="scenario3-back-default" src="./components/Scenario_Back-Default.svg" alt="돌아가기" draggable="false" />
                <img class="scenario3-back-hover" src="./components/Scenario_Back-Hover.svg" alt="" draggable="false" />
              </button>
            </article>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
