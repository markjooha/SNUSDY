<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시나리오 5</title>
    <link rel="stylesheet" href="./scenario-5.css" />
    <script src="./scenario-5.js" defer></script>
  </head>
  <body>
    <main class="scenario5-page" aria-label="시나리오 5">
      <div class="scenario5-stage">
        <section class="scenario5-frame" aria-label="층간소음 사건 시나리오">
          <div class="scenario5-intro" aria-hidden="true">
            <span class="scenario5-count"><span data-scenario5-count>0</span><span class="scenario5-degree">°</span></span>
          </div>

          <div class="scenario5-main" aria-hidden="true">
            <div class="scenario5-scroll" tabindex="0" aria-label="층간소음 사건 기사 내용">
              <div class="scenario5-scroll-content">
                <img
                  class="scenario5-art"
                  src="./scenario/scenario-5/S5_Main-Full.svg"
                  alt="층간소음 문제로 이웃 가족에게 흉기를 휘두른 60대 체포 기사"
                  draggable="false"
                />
                <button class="scenario5-back" type="button" aria-label="시나리오에서 돌아가기">
                  <span class="scenario5-back-label">돌아가기</span>
                  <i class="scenario5-back-line" aria-hidden="true"></i>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
